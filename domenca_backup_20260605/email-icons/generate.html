<!DOCTYPE html>
<html>
<head>
<style>
body { background: #1e1e1e; padding: 40px; font-family: Arial; }
.icon-container { display: flex; gap: 20px; flex-wrap: wrap; }
.icon-box { text-align: center; }
.icon { 
    width: 80px; 
    height: 80px; 
    border-radius: 16px; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    font-size: 36px;
    animation: pulse 2s ease-in-out infinite;
}
.icon-boostsuite {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
}
.icon-menuboost {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
}
.icon-adboost {
    background: linear-gradient(135deg, #f97316, #ea580c);
    box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
}
.icon-hdweb {
    background: linear-gradient(135deg, #6366f1, #ec4899);
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
}
@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}
.label { color: white; margin-top: 8px; font-size: 12px; }
</style>
</head>
<body>
<div class="icon-container">
    <div class="icon-box">
        <div class="icon icon-hdweb">🚀</div>
        <div class="label">HD Web Design</div>
    </div>
    <div class="icon-box">
        <div class="icon icon-boostsuite">📊</div>
        <div class="label">BoostSuite</div>
    </div>
    <div class="icon-box">
        <div class="icon icon-menuboost">🍽️</div>
        <div class="label">MenuBoost</div>
    </div>
    <div class="icon-box">
        <div class="icon icon-adboost">📢</div>
        <div class="label">AdBoost</div>
    </div>
</div>
</body>
</html>
