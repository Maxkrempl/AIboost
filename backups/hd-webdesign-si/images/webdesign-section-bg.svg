    <circle cx="1095" cy="158" r="6" fill="none" stroke="#1e7abf" stroke-width="1"/>
    <circle cx="1115" cy="158" r="6" fill="none" stroke="#1e7abf" stroke-width="1"/>
    <!-- Tabs -->
