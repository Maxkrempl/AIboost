    <text x="1150" y="160" font-family="'Courier New', monospace" font-size="10" fill="#3ab5ff" opacity="0.8">index.html</text>
    <rect x="1238" y="145" width="70" height="22" rx="3" fill="none" stroke="#1e7abf" stroke-width="0.6" opacity="0.4"/>
    <text x="1248" y="160" font-family="'Courier New', monospace" font-size="10" fill="#1e7abf" opacity="0.5">style.css</text>

    <!-- Line numbers column -->
    <rect x="1050" y="176" width="44" height="484" fill="#040d18" opacity="0.7"/>
    <line x1="1094" y1="176" x2="1094" y2="660" stroke="#1e7abf" stroke-width="0.5" opacity="0.3"/>

    <!-- Code lines — HTML/CSS snippets -->
