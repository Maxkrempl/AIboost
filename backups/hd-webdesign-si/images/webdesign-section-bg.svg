      <text x="1052" y="434" fill="#2a5a7a" opacity="0.6">14</text>
      <text x="1052" y="452" fill="#2a5a7a" opacity="0.6">15</text>
      <text x="1052" y="470" fill="#2a5a7a" opacity="0.6">16</text>
      <text x="1052" y="488" fill="#2a5a7a" opacity="0.6">17</text>
