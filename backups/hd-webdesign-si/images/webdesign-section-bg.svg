<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Dark blueprint background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020912;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#050e1f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#03080f;stop-opacity:1"/>
    </linearGradient>

    <!-- Blue glow left -->
    <radialGradient id="glowLeft" cx="25%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#0a3a6e;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>

    <!-- Cyan glow right -->
    <radialGradient id="glowRight" cx="78%" cy="45%" r="38%">
      <stop offset="0%" style="stop-color:#053a50;stop-opacity:0.45"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>

    <!-- Accent glow top center -->
    <radialGradient id="glowTop" cx="52%" cy="10%" r="35%">
      <stop offset="0%" style="stop-color:#0d2a5e;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.75"/>
    </radialGradient>

    <!-- Glow filter for bright elements -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft glow filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Blur for grid -->
    <filter id="gridBlur">
      <feGaussianBlur stdDeviation="0.3"/>
    </filter>

    <!-- Grain texture -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#glowLeft)"/>
  <rect width="1920" height="1080" fill="url(#glowRight)"/>
  <rect width="1920" height="1080" fill="url(#glowTop)"/>

  <!-- ===== SUBTLE GRID (blueprint base) ===== -->
  <g filter="url(#gridBlur)" opacity="0.12">
    <!-- Vertical lines -->
    <line x1="120" y1="0" x2="120" y2="1080" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="1080" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="360" y1="0" x2="360" y2="1080" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="1080" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="1080" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="1080" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="840" y1="0" x2="840" y2="1080" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="960" y1="0" x2="960" y2="1080" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="1080" y1="0" x2="1080" y2="1080" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="1200" y1="0" x2="1200" y2="1080" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="1320" y1="0" x2="1320" y2="1080" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="1560" y1="0" x2="1560" y2="1080" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="1680" y1="0" x2="1680" y2="1080" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="1800" y1="0" x2="1800" y2="1080" stroke="#1a6aaa" stroke-width="0.5"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="108" x2="1920" y2="108" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="0" y1="216" x2="1920" y2="216" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="0" y1="324" x2="1920" y2="324" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="0" y1="432" x2="1920" y2="432" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="0" y1="540" x2="1920" y2="540" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="0" y1="648" x2="1920" y2="648" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="0" y1="756" x2="1920" y2="756" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="0" y1="864" x2="1920" y2="864" stroke="#1a6aaa" stroke-width="0.5"/>
    <line x1="0" y1="972" x2="1920" y2="972" stroke="#1a6aaa" stroke-width="0.5"/>
  </g>

  <!-- ===== LEFT SIDE: BROWSER WIREFRAME ===== -->
  <g filter="url(#glow)" opacity="0.85">
    <!-- Browser shell -->
    <rect x="80" y="160" width="680" height="480" rx="8" fill="none" stroke="#1e7abf" stroke-width="1.5"/>
    <!-- Browser top bar -->
    <rect x="80" y="160" width="680" height="44" rx="8" fill="#0d2a45" stroke="#1e7abf" stroke-width="1.5"/>
    <!-- Traffic light dots -->
    <circle cx="110" cy="182" r="7" fill="none" stroke="#1e7abf" stroke-width="1.2"/>
    <circle cx="132" cy="182" r="7" fill="none" stroke="#1e7abf" stroke-width="1.2"/>
    <circle cx="154" cy="182" r="7" fill="none" stroke="#1e7abf" stroke-width="1.2"/>
    <!-- URL bar -->
    <rect x="178" y="170" width="420" height="24" rx="4" fill="none" stroke="#1e7abf" stroke-width="1"/>
    <!-- URL text -->
    <text x="190" y="186" font-family="'Courier New', monospace" font-size="11" fill="#3ab5ff" opacity="0.7">https://your-site.si</text>

    <!-- Page content wireframe inside browser -->
    <!-- Hero block -->
    <rect x="100" y="224" width="640" height="100" rx="3" fill="#0a2038" stroke="#1e7abf" stroke-width="0.8" opacity="0.6"/>
