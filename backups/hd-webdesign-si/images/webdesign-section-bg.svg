    <!-- 3 column cards below hero -->
    <rect x="100" y="336" width="190" height="130" rx="3" fill="#071828" stroke="#1e7abf" stroke-width="0.8" opacity="0.5"/>
    <rect x="305" y="336" width="190" height="130" rx="3" fill="#071828" stroke="#1e7abf" stroke-width="0.8" opacity="0.5"/>
    <rect x="510" y="336" width="230" height="130" rx="3" fill="#071828" stroke="#1e7abf" stroke-width="0.8" opacity="0.5"/>

    <!-- Card image placeholders -->
    <rect x="110" y="346" width="170" height="60" rx="2" fill="#0d2a45" stroke="#1e7abf" stroke-width="0.6" opacity="0.5"/>
    <rect x="315" y="346" width="170" height="60" rx="2" fill="#0d2a45" stroke="#1e7abf" stroke-width="0.6" opacity="0.5"/>
    <rect x="520" y="346" width="210" height="60" rx="2" fill="#0d2a45" stroke="#1e7abf" stroke-width="0.6" opacity="0.5"/>

    <!-- Card text lines -->
    <rect x="110" y="416" width="110" height="8" rx="1" fill="#1e7abf" opacity="0.3"/>
    <rect x="110" y="430" width="80" height="6" rx="1" fill="#1e7abf" opacity="0.2"/>
    <rect x="315" y="416" width="110" height="8" rx="1" fill="#1e7abf" opacity="0.3"/>
    <rect x="315" y="430" width="80" height="6" rx="1" fill="#1e7abf" opacity="0.2"/>
    <rect x="520" y="416" width="110" height="8" rx="1" fill="#1e7abf" opacity="0.3"/>
    <rect x="520" y="430" width="80" height="6" rx="1" fill="#1e7abf" opacity="0.2"/>

    <!-- Footer bar -->
    <rect x="100" y="480" width="640" height="40" rx="2" fill="#061520" stroke="#1e7abf" stroke-width="0.6" opacity="0.4"/>
