      <text x="1106" y="362" fill="#5a8fa0" opacity="0.7">    &lt;/<tspan fill="#7dd3fc">section</tspan>&gt;</text>
      <text x="1106" y="380" fill="#5a8fa0" opacity="0.55">    </text>
      <text x="1106" y="398" fill="#a78bfa" opacity="0.75">    .hero {</text>
      <text x="1106" y="416" fill="#5a8fa0" opacity="0.7">      display: <tspan fill="#86efac">grid</tspan>;</text>
      <text x="1106" y="434" fill="#5a8fa0" opacity="0.7">      gap: <tspan fill="#fde68a">2rem</tspan>;</text>
      <text x="1106" y="452" fill="#5a8fa0" opacity="0.7">      background: <tspan fill="#86efac">#050e1f</tspan>;</text>
      <text x="1106" y="470" fill="#a78bfa" opacity="0.75">    }</text>
      <text x="1106" y="488" fill="#5a8fa0" opacity="0.55">    </text>
      <text x="1106" y="506" fill="#a78bfa" opacity="0.75">    @media (max-width: <tspan fill="#fde68a">768px</tspan>) {</text>
