    <rect x="20" y="54" width="40" height="5" rx="1" fill="#1e7abf" opacity="0.25"/>
    <rect x="14" y="82" width="102" height="50" rx="2" fill="#071828" stroke="#1e7abf" stroke-width="0.5" opacity="0.4"/>
    <rect x="14" y="140" width="48" height="42" rx="2" fill="#071828" stroke="#1e7abf" stroke-width="0.5" opacity="0.4"/>
    <rect x="68" y="140" width="48" height="42" rx="2" fill="#071828" stroke="#1e7abf" stroke-width="0.5" opacity="0.4"/>
