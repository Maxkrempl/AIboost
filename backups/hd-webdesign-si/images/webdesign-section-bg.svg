      <text x="1052" y="362" fill="#2a5a7a" opacity="0.6">10</text>
      <text x="1052" y="380" fill="#2a5a7a" opacity="0.6">11</text>
      <text x="1052" y="398" fill="#2a5a7a" opacity="0.6">12</text>
