      <text x="1058" y="218" fill="#2a5a7a" opacity="0.6">2</text>
      <text x="1058" y="236" fill="#2a5a7a" opacity="0.6">3</text>
      <text x="1058" y="254" fill="#2a5a7a" opacity="0.6">4</text>
