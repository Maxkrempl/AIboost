      <text x="1052" y="632" fill="#2a5a7a" opacity="0.6">25</text>

      <!-- Code content -->
      <text x="1106" y="200" fill="#3ab5ff" opacity="0.85">&lt;!DOCTYPE html&gt;</text>
      <text x="1106" y="218" fill="#3ab5ff" opacity="0.85">&lt;<tspan fill="#7dd3fc">html</tspan> lang=<tspan fill="#86efac">"sl"</tspan>&gt;</text>
      <text x="1106" y="236" fill="#3ab5ff" opacity="0.85">  &lt;<tspan fill="#7dd3fc">head</tspan>&gt;</text>
      <text x="1106" y="254" fill="#5a8fa0" opacity="0.7">    &lt;meta charset=<tspan fill="#86efac">"UTF-8"</tspan>/&gt;</text>
      <text x="1106" y="272" fill="#5a8fa0" opacity="0.7">    &lt;title&gt;<tspan fill="#fde68a">HD Web Design</tspan>&lt;/title&gt;</text>
