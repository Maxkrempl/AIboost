      <text x="1052" y="560" fill="#2a5a7a" opacity="0.6">21</text>
      <text x="1052" y="578" fill="#2a5a7a" opacity="0.6">22</text>
      <text x="1052" y="596" fill="#2a5a7a" opacity="0.6">23</text>
