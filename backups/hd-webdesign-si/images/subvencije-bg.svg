<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Deep navy background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020a18;stop-opacity:1"/>
      <stop offset="45%" style="stop-color:#040f22;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#02091a;stop-opacity:1"/>
    </linearGradient>

    <!-- Gold glow center -->
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#5a3a00;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>

    <!-- Blue glow left -->
    <radialGradient id="glowBlue" cx="15%" cy="40%" r="35%">
      <stop offset="0%" style="stop-color:#003580;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>

    <!-- Blue glow right -->
    <radialGradient id="glowBlueR" cx="88%" cy="60%" r="35%">
      <stop offset="0%" style="stop-color:#003580;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.8"/>
    </radialGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft glow -->
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Star glow for EU stars -->
    <filter id="starGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Grain -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- EU star shape -->
    <symbol id="euStar" viewBox="-5 -5 10 10">
      <polygon points="0,-4.5 1.05,-1.45 4.28,-1.45 1.74,0.55 2.63,3.55 0,1.8 -2.63,3.55 -1.74,0.55 -4.28,-1.45 -1.05,-1.45" fill="#FFD700"/>
    </symbol>
  </defs>

  <!-- Base layers -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#glowGold)"/>
  <rect width="1920" height="1080" fill="url(#glowBlue)"/>
  <rect width="1920" height="1080" fill="url(#glowBlueR)"/>

  <!-- ===== SUBTLE DOT GRID ===== -->
  <g opacity="0.08">
    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#4a7ab5"/>
    </pattern>
    <rect width="1920" height="1080" fill="url(#dotGrid)"/>
  </g>

  <!-- ===== LEFT: EU FLAG CIRCLE ===== -->
  <g filter="url(#softGlow)" opacity="0.18" transform="translate(180, 340)">
    <circle cx="0" cy="0" r="200" fill="none" stroke="#003380" stroke-width="80"/>
    <circle cx="0" cy="0" r="200" fill="#003380" opacity="0.4"/>
  </g>
  <!-- EU Stars ring - left side decorative large -->
  <g filter="url(#starGlow)" opacity="0.55" transform="translate(180, 340)">
    <!-- 12 EU stars in circle, r=140 -->
    <use href="#euStar" transform="translate(0,-140) scale(2.2)"/>
    <use href="#euStar" transform="translate(72,-117) scale(2.2)"/>
    <use href="#euStar" transform="translate(122,-70) scale(2.2)"/>
    <use href="#euStar" transform="translate(140,0) scale(2.2)"/>
    <use href="#euStar" transform="translate(122,70) scale(2.2)"/>
    <use href="#euStar" transform="translate(72,117) scale(2.2)"/>
    <use href="#euStar" transform="translate(0,140) scale(2.2)"/>
    <use href="#euStar" transform="translate(-72,117) scale(2.2)"/>
    <use href="#euStar" transform="translate(-122,70) scale(2.2)"/>
    <use href="#euStar" transform="translate(-140,0) scale(2.2)"/>
    <use href="#euStar" transform="translate(-122,-70) scale(2.2)"/>
    <use href="#euStar" transform="translate(-72,-117) scale(2.2)"/>
  </g>

  <!-- ===== RIGHT: EU FLAG CIRCLE (mirror) ===== -->
  <g filter="url(#softGlow)" opacity="0.14" transform="translate(1740, 700)">
    <circle cx="0" cy="0" r="160" fill="#003380" opacity="0.35"/>
  </g>
  <g filter="url(#starGlow)" opacity="0.4" transform="translate(1740, 700)">
    <use href="#euStar" transform="translate(0,-110) scale(1.7)"/>
    <use href="#euStar" transform="translate(57,-92) scale(1.7)"/>
    <use href="#euStar" transform="translate(96,-55) scale(1.7)"/>
    <use href="#euStar" transform="translate(110,0) scale(1.7)"/>
    <use href="#euStar" transform="translate(96,55) scale(1.7)"/>
    <use href="#euStar" transform="translate(57,92) scale(1.7)"/>
    <use href="#euStar" transform="translate(0,110) scale(1.7)"/>
    <use href="#euStar" transform="translate(-57,92) scale(1.7)"/>
    <use href="#euStar" transform="translate(-96,55) scale(1.7)"/>
    <use href="#euStar" transform="translate(-110,0) scale(1.7)"/>
    <use href="#euStar" transform="translate(-96,-55) scale(1.7)"/>
    <use href="#euStar" transform="translate(-57,-92) scale(1.7)"/>
  </g>

  <!-- ===== CENTER: OFFICIAL DOCUMENT ===== -->
  <g filter="url(#glow)" opacity="0.82">
    <!-- Document shadow -->
    <rect x="618" y="138" width="700" height="820" rx="4" fill="#000000" opacity="0.5"/>
    <!-- Document body -->
    <rect x="610" y="130" width="700" height="820" rx="4" fill="#040f22" stroke="#1a4a8a" stroke-width="1.2"/>
    <!-- Document top blue band -->
    <rect x="610" y="130" width="700" height="8" rx="4" fill="#003380"/>
    <!-- Bottom band -->
    <rect x="610" y="942" width="700" height="8" rx="4" fill="#003380"/>

    <!-- EU header bar -->
    <rect x="610" y="138" width="700" height="80" fill="#020e2a" opacity="0.8"/>
    <!-- EU flag mini (top center of document) -->
    <rect x="870" y="152" width="80" height="54" rx="2" fill="#003380" opacity="0.9"/>
    <!-- Mini EU stars -->
    <g fill="#FFD700" opacity="0.9">
      <circle cx="910" cy="164" r="2"/>
      <circle cx="922" cy="168" r="2"/>
      <circle cx="926" cy="180" r="2"/>
      <circle cx="918" cy="190" r="2"/>
      <circle cx="906" cy="190" r="2"/>
      <circle cx="898" cy="180" r="2"/>
      <circle cx="898" cy="168" r="2"/>
    </g>

    <!-- Header text area -->
    <rect x="640" y="152" width="220" height="12" rx="2" fill="#1a4a8a" opacity="0.5"/>
    <rect x="640" y="170" width="180" height="8" rx="2" fill="#1a4a8a" opacity="0.35"/>
    <rect x="965" y="152" width="180" height="12" rx="2" fill="#1a4a8a" opacity="0.5"/>
    <rect x="965" y="170" width="140" height="8" rx="2" fill="#1a4a8a" opacity="0.35"/>

    <!-- Document title area -->
    <rect x="650" y="240" width="620" height="2" fill="#1a4a8a" opacity="0.6"/>
    <rect x="650" y="280" width="500" height="18" rx="2" fill="#2a5aaa" opacity="0.35"/>
    <rect x="650" y="306" width="380" height="12" rx="2" fill="#1a4a8a" opacity="0.25"/>
    <rect x="650" y="325" width="260" height="10" rx="2" fill="#1a4a8a" opacity="0.18"/>
    <rect x="650" y="348" width="620" height="1" fill="#1a4a8a" opacity="0.4"/>

    <!-- Razpis number badge -->
    <rect x="650" y="260" width="140" height="14" rx="7" fill="#003380" stroke="#FFD700" stroke-width="0.8" opacity="0.8"/>
    <text x="666" y="271" font-family="'Courier New', monospace" font-size="9" fill="#FFD700" opacity="0.9">Razpis 2025/14-EU</text>

    <!-- Section: Vsebina -->
    <text x="660" y="390" font-family="Georgia, serif" font-size="11" fill="#4a7ab5" opacity="0.7" font-style="italic">I. NAMEN IN CILJI RAZPISA</text>
    <rect x="650" y="398" width="620" height="1" fill="#1a4a8a" opacity="0.3"/>

    <!-- Paragraph lines -->
    <rect x="660" y="412" width="590" height="7" rx="1" fill="#1a4a8a" opacity="0.22"/>
    <rect x="660" y="424" width="570" height="7" rx="1" fill="#1a4a8a" opacity="0.2"/>
    <rect x="660" y="436" width="610" height="7" rx="1" fill="#1a4a8a" opacity="0.22"/>
    <rect x="660" y="448" width="480" height="7" rx="1" fill="#1a4a8a" opacity="0.18"/>

    <!-- Section 2 -->
    <text x="660" y="480" font-family="Georgia, serif" font-size="11" fill="#4a7ab5" opacity="0.7" font-style="italic">II. UPRAVIČENI STROŠKI</text>
    <rect x="650" y="488" width="620" height="1" fill="#1a4a8a" opacity="0.3"/>
    <rect x="660" y="502" width="590" height="7" rx="1" fill="#1a4a8a" opacity="0.22"/>
    <rect x="660" y="514" width="550" height="7" rx="1" fill="#1a4a8a" opacity="0.2"/>
    <rect x="660" y="526" width="600" height="7" rx="1" fill="#1a4a8a" opacity="0.22"/>
    <rect x="660" y="538" width="420" height="7" rx="1" fill="#1a4a8a" opacity="0.18"/>

    <!-- Checkbox items -->
    <rect x="660" y="558" width="10" height="10" rx="1" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
    <rect x="678" y="561" width="180" height="6" rx="1" fill="#2a5aaa" opacity="0.3"/>
    <rect x="660" y="574" width="10" height="10" rx="1" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
    <rect x="678" y="577" width="220" height="6" rx="1" fill="#2a5aaa" opacity="0.3"/>
    <rect x="660" y="590" width="10" height="10" rx="1" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
    <line x1="661" y1="595" x2="668" y2="600" stroke="#FFD700" stroke-width="1.5" opacity="0.8"/>
    <line x1="668" y1="600" x2="669" y2="591" stroke="#FFD700" stroke-width="1.5" opacity="0.8"/>
    <rect x="678" y="593" width="200" height="6" rx="1" fill="#2a5aaa" opacity="0.3"/>

    <!-- Amount highlight box -->
    <rect x="650" y="620" width="620" height="60" rx="3" fill="#003380" opacity="0.25" stroke="#FFD700" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="668" y="644" font-family="Georgia, serif" font-size="10" fill="#FFD700" opacity="0.75">Vrednost razpisa:</text>
    <rect x="668" y="650" width="160" height="18" rx="2" fill="#FFD700" opacity="0.12"/>
    <text x="676" y="663" font-family="'Courier New', monospace" font-size="13" fill="#FFD700" font-weight="700" opacity="0.85">do 50.000 €</text>
    <rect x="900" y="640" width="120" height="10" rx="1" fill="#2a5aaa" opacity="0.3"/>
    <rect x="900" y="656" width="90" height="10" rx="1" fill="#2a5aaa" opacity="0.2"/>

    <!-- Section 3 -->
    <text x="660" y="706" font-family="Georgia, serif" font-size="11" fill="#4a7ab5" opacity="0.7" font-style="italic">III. ROK ZA ODDAJO VLOGE</text>
    <rect x="650" y="714" width="620" height="1" fill="#1a4a8a" opacity="0.3"/>
    <rect x="660" y="728" width="400" height="7" rx="1" fill="#1a4a8a" opacity="0.22"/>
    <rect x="660" y="740" width="500" height="7" rx="1" fill="#1a4a8a" opacity="0.2"/>

    <!-- Deadline badge -->
    <rect x="660" y="758" width="180" height="28" rx="4" fill="#003380" stroke="#FFD700" stroke-width="0.8" opacity="0.9"/>
    <text x="676" y="776" font-family="'Courier New', monospace" font-size="11" fill="#FFD700" opacity="0.95">31. 12. 2025</text>

    <!-- Official stamp circle -->
    <circle cx="1210" cy="820" r="55" fill="none" stroke="#FFD700" stroke-width="1.2" opacity="0.35"/>
    <circle cx="1210" cy="820" r="48" fill="none" stroke="#FFD700" stroke-width="0.6" opacity="0.25"/>
    <text x="1210" y="814" font-family="Georgia, serif" font-size="8" fill="#FFD700" opacity="0.45" text-anchor="middle">REPUBLIKA SLOVENIJA</text>
    <text x="1210" y="826" font-family="Georgia, serif" font-size="8" fill="#FFD700" opacity="0.45" text-anchor="middle">URADNI PEČAT</text>

    <!-- Signature lines at bottom -->
    <line x1="660" y1="890" x2="820" y2="890" stroke="#1a4a8a" stroke-width="0.8" opacity="0.5"/>
    <line x1="900" y1="890" x2="1060" y2="890" stroke="#1a4a8a" stroke-width="0.8" opacity="0.5"/>
    <rect x="660" y="896" width="80" height="5" rx="1" fill="#1a4a8a" opacity="0.2"/>
    <rect x="900" y="896" width="80" height="5" rx="1" fill="#1a4a8a" opacity="0.2"/>

    <!-- Bottom gold line accent -->
    <line x1="650" y1="930" x2="1270" y2="930" stroke="#FFD700" stroke-width="0.6" opacity="0.3"/>
  </g>

  <!-- ===== FLOATING STAT CARDS ===== -->
  <!-- Left stat card -->
  <g filter="url(#glow)" opacity="0.75" transform="translate(60, 440)">
    <rect width="240" height="110" rx="6" fill="#040f22" stroke="#1a4a8a" stroke-width="1"/>
    <rect width="240" height="5" rx="3" fill="#FFD700" opacity="0.6"/>
    <text x="18" y="36" font-family="Georgia, serif" font-size="11" fill="#4a7ab5" opacity="0.8">Sofinanciranje</text>
    <text x="18" y="65" font-family="'Courier New', monospace" font-size="28" fill="#FFD700" font-weight="700" opacity="0.9">85%</text>
    <rect x="18" y="78" width="140" height="6" rx="1" fill="#1a4a8a" opacity="0.3"/>
    <rect x="18" y="90" width="100" height="6" rx="1" fill="#1a4a8a" opacity="0.2"/>
  </g>

  <!-- Left stat card 2 -->
  <g filter="url(#glow)" opacity="0.65" transform="translate(60, 580)">
    <rect width="240" height="110" rx="6" fill="#040f22" stroke="#1a4a8a" stroke-width="1"/>
    <rect width="240" height="5" rx="3" fill="#003380" opacity="0.9"/>
    <text x="18" y="36" font-family="Georgia, serif" font-size="11" fill="#4a7ab5" opacity="0.8">Aktivnih razpisov</text>
    <text x="18" y="65" font-family="'Courier New', monospace" font-size="28" fill="#5ab5ff" font-weight="700" opacity="0.9">24</text>
    <rect x="18" y="78" width="120" height="6" rx="1" fill="#1a4a8a" opacity="0.3"/>
    <rect x="18" y="90" width="90" height="6" rx="1" fill="#1a4a8a" opacity="0.2"/>
  </g>

  <!-- Right stat card -->
  <g filter="url(#glow)" opacity="0.7" transform="translate(1620, 380)">
    <rect width="240" height="110" rx="6" fill="#040f22" stroke="#1a4a8a" stroke-width="1"/>
    <rect width="240" height="5" rx="3" fill="#FFD700" opacity="0.5"/>
    <text x="18" y="36" font-family="Georgia, serif" font-size="11" fill="#4a7ab5" opacity="0.8">EU sklad 2021–27</text>
    <text x="18" y="65" font-family="'Courier New', monospace" font-size="22" fill="#FFD700" font-weight="700" opacity="0.9">3.3 mrd €</text>
    <rect x="18" y="78" width="150" height="6" rx="1" fill="#1a4a8a" opacity="0.3"/>
    <rect x="18" y="90" width="110" height="6" rx="1" fill="#1a4a8a" opacity="0.2"/>
  </g>

  <!-- Right stat card 2 -->
  <g filter="url(#glow)" opacity="0.6" transform="translate(1620, 520)">
    <rect width="240" height="110" rx="6" fill="#040f22" stroke="#1a4a8a" stroke-width="1"/>
    <rect width="240" height="5" rx="3" fill="#003380" opacity="0.9"/>
    <text x="18" y="36" font-family="Georgia, serif" font-size="11" fill="#4a7ab5" opacity="0.8">Uspešnih vlog</text>
    <text x="18" y="65" font-family="'Courier New', monospace" font-size="28" fill="#86efac" font-weight="700" opacity="0.9">91%</text>
    <rect x="18" y="78" width="130" height="6" rx="1" fill="#1a4a8a" opacity="0.3"/>
    <rect x="18" y="90" width="100" height="6" rx="1" fill="#1a4a8a" opacity="0.2"/>
  </g>

  <!-- ===== THIN HORIZONTAL GOLD LINE ACCENTS ===== -->
  <line x1="0" y1="120" x2="610" y2="120" stroke="#FFD700" stroke-width="0.5" opacity="0.2"/>
  <line x1="1310" y1="120" x2="1920" y2="120" stroke="#FFD700" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="960" x2="610" y2="960" stroke="#FFD700" stroke-width="0.5" opacity="0.15"/>
  <line x1="1310" y1="960" x2="1920" y2="960" stroke="#FFD700" stroke-width="0.5" opacity="0.15"/>

  <!-- ===== BOTTOM TICKER ===== -->
  <g opacity="0.35">
    <line x1="0" y1="1020" x2="1920" y2="1020" stroke="#1a4a8a" stroke-width="0.6"/>
    <text x="60" y="1048" font-family="Georgia, serif" font-size="11" fill="#4a7ab5" font-style="italic">ESRR · ESS+ · KS · EKSRP · JTF</text>
    <text x="420" y="1048" font-family="Georgia, serif" font-size="11" fill="#4a7ab5" font-style="italic">·</text>
    <text x="440" y="1048" font-family="Georgia, serif" font-size="11" fill="#4a7ab5" font-style="italic">SPIRIT · SPS · JAPTI</text>
    <text x="660" y="1048" font-family="Georgia, serif" font-size="11" fill="#4a7ab5" font-style="italic">·</text>
    <text x="680" y="1048" font-family="Georgia, serif" font-size="11" fill="#4a7ab5" font-style="italic">Digitalizacija · Zeleni prehod · Inovacije</text>
    <text x="1020" y="1048" font-family="Georgia, serif" font-size="11" fill="#4a7ab5" font-style="italic">·</text>
    <text x="1040" y="1048" font-family="Georgia, serif" font-size="11" fill="#4a7ab5" font-style="italic">MSP · Startup · Kmetijstvo · Turizem</text>
    <text x="1380" y="1048" font-family="Georgia, serif" font-size="11" fill="#4a7ab5" font-style="italic">·</text>
    <text x="1400" y="1048" font-family="Georgia, serif" font-size="11" fill="#4a7ab5" font-style="italic">Slovenija 2025–2027</text>
  </g>

  <!-- HD watermark -->
  <text x="1858" y="1068" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#FFD700" opacity="0.12">&lt;HD&gt;</text>

  <!-- Grain overlay -->
  <rect width="1920" height="1080" opacity="0.05" filter="url(#grain)" fill="#ffffff"/>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
