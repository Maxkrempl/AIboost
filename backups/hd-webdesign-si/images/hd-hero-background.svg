<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Deep dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05050f;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#090820;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0618;stop-opacity:1" />
    </linearGradient>

    <!-- Purple-blue radial glow center -->
    <radialGradient id="glowCenter" cx="38%" cy="48%" r="45%">
      <stop offset="0%" style="stop-color:#3b1d8a;stop-opacity:0.45" />
      <stop offset="60%" style="stop-color:#1a0d4a;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>

    <!-- Secondary blue glow right -->
    <radialGradient id="glowRight" cx="80%" cy="30%" r="35%">
      <stop offset="0%" style="stop-color:#1a4a9a;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>

    <!-- Bottom-left teal glow -->
    <radialGradient id="glowBottomLeft" cx="10%" cy="85%" r="30%">
      <stop offset="0%" style="stop-color:#0d3d6e;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>

    <!-- Node glow filter -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft line blur -->
    <filter id="lineBlur">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>

    <!-- Grain texture -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- HD monogram definition -->
    <symbol id="hdMark" viewBox="0 0 60 40">
      <text x="2" y="32" font-family="'Courier New', monospace" font-size="28" font-weight="700" fill="none" stroke="#6c47ff" stroke-width="1.5" opacity="0.9">&lt;HD&gt;</text>
    </symbol>
  </defs>

  <!-- Base background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Atmosphere glows -->
  <rect width="1920" height="1080" fill="url(#glowCenter)"/>
  <rect width="1920" height="1080" fill="url(#glowRight)"/>
  <rect width="1920" height="1080" fill="url(#glowBottomLeft)"/>

  <!-- === NETWORK EDGES (lines between nodes) === -->
  <g filter="url(#lineBlur)" opacity="0.55">
    <!-- Main cluster lines -->
    <line x1="320" y1="180" x2="510" y2="290" stroke="#4a2db5" stroke-width="0.8"/>
    <line x1="510" y1="290" x2="680" y2="210" stroke="#4a2db5" stroke-width="0.6"/>
    <line x1="510" y1="290" x2="640" y2="420" stroke="#3a4abf" stroke-width="0.9"/>
    <line x1="640" y1="420" x2="800" y2="360" stroke="#2a5abf" stroke-width="0.7"/>
    <line x1="640" y1="420" x2="580" y2="560" stroke="#4a2db5" stroke-width="0.5"/>
    <line x1="800" y1="360" x2="960" y2="280" stroke="#2a6aaf" stroke-width="0.8"/>
    <line x1="800" y1="360" x2="920" y2="490" stroke="#3a4abf" stroke-width="0.6"/>
    <line x1="960" y1="280" x2="1100" y2="350" stroke="#2a6aaf" stroke-width="0.9"/>
    <line x1="960" y1="280" x2="1050" y2="160" stroke="#4a2db5" stroke-width="0.7"/>
    <line x1="1100" y1="350" x2="1240" y2="260" stroke="#2a5abf" stroke-width="0.6"/>
    <line x1="1100" y1="350" x2="1190" y2="480" stroke="#3a4abf" stroke-width="0.8"/>
    <line x1="1240" y1="260" x2="1380" y2="320" stroke="#2a6aaf" stroke-width="0.7"/>
    <line x1="1380" y1="320" x2="1520" y2="240" stroke="#3060bf" stroke-width="0.6"/>
    <line x1="1380" y1="320" x2="1460" y2="450" stroke="#4a2db5" stroke-width="0.8"/>
    <line x1="1520" y1="240" x2="1680" y2="310" stroke="#2a6aaf" stroke-width="0.7"/>
    <line x1="1680" y1="310" x2="1800" y2="200" stroke="#3060bf" stroke-width="0.5"/>
    <line x1="1680" y1="310" x2="1760" y2="430" stroke="#4a2db5" stroke-width="0.6"/>

    <!-- Mid tier lines -->
    <line x1="580" y1="560" x2="720" y2="620" stroke="#3a4abf" stroke-width="0.7"/>
    <line x1="720" y1="620" x2="920" y2="490" stroke="#2a5abf" stroke-width="0.9"/>
    <line x1="920" y1="490" x2="1060" y2="580" stroke="#3a4abf" stroke-width="0.6"/>
    <line x1="1060" y1="580" x2="1190" y2="480" stroke="#2a6aaf" stroke-width="0.8"/>
    <line x1="1190" y1="480" x2="1340" y2="550" stroke="#3a4abf" stroke-width="0.7"/>
    <line x1="1340" y1="550" x2="1460" y2="450" stroke="#2a5abf" stroke-width="0.6"/>
    <line x1="1460" y1="450" x2="1600" y2="530" stroke="#4a2db5" stroke-width="0.8"/>
    <line x1="1600" y1="530" x2="1760" y2="430" stroke="#2a6aaf" stroke-width="0.5"/>

    <!-- Lower tier lines -->
    <line x1="200" y1="700" x2="400" y2="750" stroke="#3a4abf" stroke-width="0.6"/>
    <line x1="400" y1="750" x2="580" y2="560" stroke="#4a2db5" stroke-width="0.5"/>
    <line x1="400" y1="750" x2="550" y2="820" stroke="#2a5abf" stroke-width="0.7"/>
    <line x1="550" y1="820" x2="720" y2="620" stroke="#3a4abf" stroke-width="0.6"/>
    <line x1="720" y1="620" x2="860" y2="760" stroke="#2a6aaf" stroke-width="0.8"/>
    <line x1="860" y1="760" x2="1060" y2="580" stroke="#3a4abf" stroke-width="0.7"/>
    <line x1="860" y1="760" x2="1000" y2="880" stroke="#4a2db5" stroke-width="0.5"/>
    <line x1="1000" y1="880" x2="1200" y2="820" stroke="#2a5abf" stroke-width="0.6"/>
    <line x1="1200" y1="820" x2="1340" y2="550" stroke="#3a4abf" stroke-width="0.7"/>
    <line x1="1200" y1="820" x2="1400" y2="900" stroke="#2a6aaf" stroke-width="0.5"/>
    <line x1="1400" y1="900" x2="1600" y2="530" stroke="#3060bf" stroke-width="0.6"/>
    <line x1="1400" y1="900" x2="1580" y2="820" stroke="#4a2db5" stroke-width="0.7"/>
    <line x1="1580" y1="820" x2="1760" y2="430" stroke="#2a6aaf" stroke-width="0.5"/>

    <!-- Cross connectors for density -->
    <line x1="320" y1="180" x2="680" y2="210" stroke="#4a2db5" stroke-width="0.4" opacity="0.6"/>
    <line x1="1050" y1="160" x2="1240" y2="260" stroke="#3060bf" stroke-width="0.4" opacity="0.5"/>
    <line x1="920" y1="490" x2="1190" y2="480" stroke="#2a5abf" stroke-width="0.4" opacity="0.6"/>
    <line x1="640" y1="420" x2="920" y2="490" stroke="#3a4abf" stroke-width="0.4" opacity="0.5"/>
    <line x1="200" y1="700" x2="400" y2="560" stroke="#4a2db5" stroke-width="0.35" opacity="0.4"/>
    <line x1="1800" y1="200" x2="1760" y2="430" stroke="#2a6aaf" stroke-width="0.4" opacity="0.4"/>
  </g>

  <!-- === NODES (dots at intersections) === -->
  <g filter="url(#nodeGlow)">
    <!-- Bright/large nodes — key hubs -->
    <circle cx="640" cy="420" r="4.5" fill="#7c5cff" opacity="0.95"/>
    <circle cx="960" cy="280" r="5" fill="#8a6fff" opacity="1"/>
    <circle cx="1100" cy="350" r="4" fill="#6a8fff" opacity="0.9"/>
    <circle cx="510" cy="290" r="3.5" fill="#7c5cff" opacity="0.85"/>
    <circle cx="920" cy="490" r="4" fill="#5a7aff" opacity="0.9"/>
    <circle cx="1380" cy="320" r="4" fill="#6a8fff" opacity="0.85"/>
    <circle cx="1190" cy="480" r="3.5" fill="#7c5cff" opacity="0.8"/>
    <circle cx="720" cy="620" r="3.5" fill="#5a7aff" opacity="0.85"/>
    <circle cx="1060" cy="580" r="4" fill="#6a8fff" opacity="0.9"/>
    <circle cx="860" cy="760" r="3.5" fill="#7c5cff" opacity="0.8"/>

    <!-- Medium nodes -->
    <circle cx="320" cy="180" r="3" fill="#9070ff" opacity="0.75"/>
    <circle cx="680" cy="210" r="2.5" fill="#6a8fff" opacity="0.7"/>
    <circle cx="800" cy="360" r="3" fill="#5a7aff" opacity="0.75"/>
    <circle cx="1050" cy="160" r="2.5" fill="#8a6fff" opacity="0.7"/>
    <circle cx="1240" cy="260" r="3" fill="#6a8fff" opacity="0.75"/>
    <circle cx="1520" cy="240" r="2.5" fill="#5a7aff" opacity="0.7"/>
    <circle cx="1680" cy="310" r="3" fill="#7c5cff" opacity="0.75"/>
    <circle cx="1800" cy="200" r="2" fill="#6a8fff" opacity="0.65"/>
    <circle cx="1460" cy="450" r="3" fill="#5a7aff" opacity="0.75"/>
    <circle cx="1340" cy="550" r="2.5" fill="#7c5cff" opacity="0.7"/>
    <circle cx="1600" cy="530" r="3" fill="#6a8fff" opacity="0.75"/>
    <circle cx="1760" cy="430" r="2.5" fill="#5a7aff" opacity="0.7"/>
    <circle cx="580" cy="560" r="2.5" fill="#8a6fff" opacity="0.7"/>
    <circle cx="200" cy="700" r="2.5" fill="#6a8fff" opacity="0.65"/>
    <circle cx="400" cy="750" r="2.5" fill="#7c5cff" opacity="0.7"/>
    <circle cx="550" cy="820" r="2" fill="#5a7aff" opacity="0.65"/>
    <circle cx="1000" cy="880" r="2.5" fill="#8a6fff" opacity="0.7"/>
    <circle cx="1200" cy="820" r="2.5" fill="#6a8fff" opacity="0.7"/>
    <circle cx="1400" cy="900" r="2" fill="#7c5cff" opacity="0.65"/>
    <circle cx="1580" cy="820" r="2" fill="#5a7aff" opacity="0.6"/>

    <!-- Small accent nodes scattered -->
    <circle cx="160" cy="320" r="1.5" fill="#9070ff" opacity="0.5"/>
    <circle cx="420" cy="140" r="1.5" fill="#6a8fff" opacity="0.5"/>
    <circle cx="760" cy="100" r="1.5" fill="#7c5cff" opacity="0.45"/>
    <circle cx="1160" cy="120" r="1.5" fill="#5a7aff" opacity="0.5"/>
    <circle cx="1600" cy="140" r="1.5" fill="#9070ff" opacity="0.45"/>
    <circle cx="1880" cy="480" r="1.5" fill="#6a8fff" opacity="0.45"/>
    <circle cx="100" cy="560" r="1.5" fill="#8a6fff" opacity="0.4"/>
    <circle cx="300" cy="940" r="1.5" fill="#5a7aff" opacity="0.4"/>
    <circle cx="700" cy="960" r="1.5" fill="#7c5cff" opacity="0.4"/>
    <circle cx="1680" cy="920" r="1.5" fill="#6a8fff" opacity="0.4"/>
    <circle cx="1860" cy="780" r="1.5" fill="#9070ff" opacity="0.4"/>
  </g>

  <!-- === SUBTLE HORIZONTAL SCANLINES for depth === -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="1920" y2="100" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="200" x2="1920" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1920" y2="300" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="400" x2="1920" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="500" x2="1920" y2="500" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="600" x2="1920" y2="600" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="700" x2="1920" y2="700" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="800" x2="1920" y2="800" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="900" x2="1920" y2="900" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="1000" x2="1920" y2="1000" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- === HD MONOGRAM watermark bottom right === -->
  <g transform="translate(1820, 1030)" opacity="0.12">
    <text font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#7c5cff">&lt;HD&gt;</text>
  </g>

  <!-- === Grain overlay for texture === -->
  <rect width="1920" height="1080" opacity="0.06" filter="url(#grain)" fill="#ffffff"/>

  <!-- === Vignette (dark edges) === -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
    <stop offset="100%" style="stop-color:#000000;stop-opacity:0.65"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
