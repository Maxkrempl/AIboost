<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ListTranslate — AI跨境翻译</title>
    <meta name="description" content="专为跨境电商卖家打造的AI翻译工具">
    <meta name="theme-color" content="#ff4d4f">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: #f5f5f5;
            color: #333;
            -webkit-text-size-adjust: none;
        }
        .header {
            background: linear-gradient(135deg, #ff4d4f 0%, #ff7875 100%);
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
        }
        .header h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 0.5rem; }
        .header p { opacity: 0.9; font-size: 0.95rem; }
        .stats {
            display: flex;
            justify-content: space-around;
            background: white;
            padding: 1rem;
            margin: -1rem 1rem 1rem;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .stat { text-align: center; }
        .stat-num { font-size: 1.3rem; font-weight: 900; color: #ff4d4f; }
        .stat-label { font-size: 0.75rem; color: #999; }
        .tool {
            background: white;
            margin: 1rem;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }
        .tool h2 { font-size: 1.1rem; margin-bottom: 1rem; }
        select, textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 0.8rem;
            background: #fafafa;
        }
        textarea {
            min-height: 150px;
            resize: none;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 1rem;
            background: #ff4d4f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .btn:disabled { opacity: 0.5; }
        .result {
            display: none;
            margin-top: 1rem;
            background: #fffbe6;
            border-radius: 8px;
            padding: 1rem;
        }
        .result.show { display: block; }
        .result h3 { font-size: 0.95rem; color: #ff4d4f; margin-bottom: 0.8rem; }
        .result-item {
            background: white;
            border-radius: 8px;
            padding: 0.8rem;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        .result-item label { font-weight: 700; display: block; margin-bottom: 0.3rem; color: #666; font-size: 0.8rem; }
        .copy-btn {
            float: right;
            background: none;
            border: 1px solid #ddd;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .platforms {
            margin: 1rem;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }
        .platform {
            background: white;
            padding: 0.8rem 0.5rem;
            border-radius: 8px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid #f0f0f0;
        }
        .cta {
            margin: 1rem;
            background: linear-gradient(135deg, #ff4d4f 0%, #ff7875 100%);
            color: white;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }
        .cta h3 { font-size: 1.2rem; margin-bottom: 0.5rem; }
        .cta p { opacity: 0.9; font-size: 0.9rem; margin-bottom: 1rem; }
        .cta .btn { background: white; color: #ff4d4f; }
        .footer {
            text-align: center;
            padding: 2rem;
            color: #999;
            font-size: 0.8rem;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔥 ListTranslate</h1>
        <p>中文产品信息 → 爆款跨境 Listing</p>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat-num">3秒</div>
            <div class="stat-label">翻译速度</div>
        </div>
        <div class="stat">
            <div class="stat-num">7</div>
            <div class="stat-label">支持平台</div>
        </div>
        <div class="stat">
            <div class="stat-num">4</div>
            <div class="stat-label">目标语言</div>
        </div>
    </div>

    <div class="tool">
        <h2>✨ 免费翻译</h2>
        <select id="platform">
            <option value="amazon-us">🇺🇸 亚马逊美国站</option>
            <option value="amazon-uk">🇬🇧 亚马逊英国站</option>
            <option value="amazon-jp">🇯🇵 亚马逊日本站</option>
            <option value="shopee-th">🇹🇭 Shopee 泰国</option>
            <option value="shopee-my">🇲🇾 Shopee 马来西亚</option>
            <option value="tiktok-us">🎵 TikTok Shop</option>
            <option value="etsy">🛍️ Etsy</option>
        </select>
        <textarea id="input" placeholder="粘贴中文产品信息...&#10;&#10;例如：品名、特点、规格、适用场景等"></textarea>
        <button class="btn" id="btn" onclick="go()">🔄 开始翻译</button>
        <div class="result" id="result">
            <h3>📋 翻译结果</h3>
            <div id="output"></div>
        </div>
    </div>

    <div class="platforms">
        <div class="platform">🇺🇸 Amazon</div>
        <div class="platform">🇬🇧 Amazon UK</div>
        <div class="platform">🇯🇵 Amazon JP</div>
        <div class="platform">🇹🇭 Shopee</div>
        <div class="platform">🎵 TikTok</div>
        <div class="platform">🛍️ Etsy</div>
        <div class="platform">📦 eBay</div>
        <div class="platform">🏪 独立站</div>
    </div>

    <div class="cta">
        <h3>升级专业版</h3>
        <p>无限翻译 + 关键词研究 + 竞品分析</p>
        <button class="btn" onclick="alert('请联系微信客服：ListTranslate')">¥99/月 立即订阅</button>
    </div>

    <div class="footer">
        <p>© 2026 ListTranslate</p>
        <p style="margin-top:0.5rem;">微信客服：ListTranslate</p>
    </div>

    <script>
    async function go() {
        const input = document.getElementById('input').value.trim();
        const platform = document.getElementById('platform').value;
        const btn = document.getElementById('btn');
        if (!input) { alert('请输入产品信息'); return; }
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> 翻译中...';
        try {
            const r = await fetch('https://listtranslate.netlify.app/.netlify/functions/translate-listing', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ input, platform, language: 'en' })
            });
            const d = await r.json();
            if (d.error) { alert('翻译失败：' + d.error); return; }
            const out = document.getElementById('output');
            out.innerHTML = '';
            [['📌 Title', d.title], ['🎯 Bullets', d.bullets], ['📝 Description', d.description], ['🔍 Keywords', d.keywords]].forEach(([label, val]) => {
                if (val) {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.innerHTML = `<button class="copy-btn" onclick="cp(this)">复制</button><label>${label}</label><p style="white-space:pre-wrap;margin:0.3rem 0 0;font-size:0.85rem;">${val}</p>`;
                    out.appendChild(div);
                }
            });
            document.getElementById('result').classList.add('show');
        } catch(e) { alert('请求失败'); }
        btn.disabled = false;
        btn.innerHTML = '🔄 开始翻译';
    }
    function cp(b) {
        const t = b.parentElement.querySelector('p').textContent;
        navigator.clipboard.writeText(t).then(() => { b.textContent='✓'; setTimeout(()=>b.textContent='复制',1500); });
    }
    </script>
</body>
</html>
