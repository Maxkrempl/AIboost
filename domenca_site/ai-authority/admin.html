<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Authority — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f8f9fa;color:#1a1a2e;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center}
.topbar h1{font-size:1.1rem;font-weight:700}
.topbar .stats{display:flex;gap:1.5rem;font-size:.8rem;color:#6b7280}
.topbar .stats span{font-weight:700;color:#1a1a2e}
.container{max-width:1200px;margin:2rem auto;padding:0 2rem}

/* Tabs */
.tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;border-bottom:1px solid #e5e7eb;padding-bottom:.5rem}
.tab{padding:.5rem 1rem;border:none;background:none;font-size:.85rem;font-weight:500;cursor:pointer;color:#6b7280;border-radius:6px 6px 0 0;transition:all .15s}
.tab:hover{color:#1a1a2e;background:#f3f4f6}
.tab.active{color:#1a1a2e;background:#fff;border:1px solid #e5e7eb;border-bottom:1px solid #fff}

/* Audit Form */
.audit-form{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:1.5rem;margin-bottom:2rem}
.audit-form h3{font-size:.9rem;font-weight:600;margin-bottom:1rem}
.form-row{display:flex;gap:.75rem;align-items:end}
.form-group{flex:1}
.form-group label{display:block;font-size:.75rem;font-weight:600;color:#6b7280;margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.04em}
.form-group input{width:100%;padding:.6rem .8rem;border:1px solid #e5e7eb;border-radius:6px;font-size:.85rem;font-family:inherit}
.form-group input:focus{outline:none;border-color:#1a1a2e}
.btn{padding:.6rem 1.2rem;background:#1a1a2e;color:#fff;border:none;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap}
.btn:hover{background:#374151}
.btn:disabled{background:#ccc;cursor:not-allowed}
.btn-sm{padding:.4rem .8rem;font-size:.75rem}

/* Orders Table */
.orders-table{width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;border-collapse:collapse}
.orders-table th{text-align:left;padding:.75rem 1rem;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;background:#f9fafb;border-bottom:1px solid #e5e7eb}
.orders-table td{padding:.75rem 1rem;font-size:.8rem;border-bottom:1px solid #f3f4f6}
.orders-table tr:hover{background:#f9fafb}
.orders-table .badge{display:inline-block;padding:.15rem .5rem;border-radius:4px;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.badge-active{background:#d1fae5;color:#065f46}
.badge-pending{background:#fef3c7;color:#92400e}
.badge-expired{background:#fee2e2;color:#991b1b}
.badge-cancelled{background:#e5e7eb;color:#374151}
.score{display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;border-radius:50%;font-size:.7rem;font-weight:700}
.score-a{background:#d1fae5;color:#065f46}
.score-b{background:#dbeafe;color:#1e40af}
.score-c{background:#fef3c7;color:#92400e}
.score-d{background:#fee2e2;color:#991b1b}

/* Report Panel */
.report-panel{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:1.5rem;margin-top:1.5rem;display:none}
.report-panel.show{display:block}
.report-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:1.5rem}
.checks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.75rem}
.check-card{border:1px solid #f3f4f6;border-radius:8px;padding:1rem;display:flex;align-items:start;gap:.75rem}
.check-icon{width:2rem;height:2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.check-pass{background:#d1fae5;color:#065f46}
.check-fail{background:#fee2e2;color:#991b1b}
.check-info h4{font-size:.8rem;font-weight:600;margin-bottom:.2rem}
.check-info p{font-size:.7rem;color:#6b7280;line-height:1.4}

/* Deliverables */
.deliverables{margin-top:1.5rem}
.deliverable{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:1rem;margin-bottom:.75rem}
.deliverable h4{font-size:.8rem;font-weight:600;margin-bottom:.5rem;display:flex;justify-content:space-between}
.deliverable pre{background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:.75rem;font-size:.7rem;overflow-x:auto;max-height:300px;overflow-y:auto;font-family:'SF Mono',Monaco,Consolas,monospace}
.copy-btn{background:none;border:1px solid #e5e7eb;padding:.2rem .5rem;border-radius:4px;font-size:.65rem;cursor:pointer;font-family:inherit}
.copy-btn:hover{background:#fff}

/* Recommendations */
.rec-list{margin-top:1.5rem}
.rec-item{border:1px solid #f3f4f6;border-radius:8px;padding:1rem;margin-bottom:.5rem;display:flex;gap:1rem;align-items:start}
.rec-priority{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:.2rem .5rem;border-radius:3px;white-space:nowrap}
.rec-high{background:#fee2e2;color:#991b1b}
.rec-medium{background:#fef3c7;color:#92400e}
.rec-low{background:#dbeafe;color:#1e40af}
.rec-info h4{font-size:.8rem;font-weight:600;margin-bottom:.15rem}
.rec-info p{font-size:.7rem;color:#6b7280;line-height:1.4}
.rec-info .impact{font-size:.65rem;color:#059669;font-weight:600;margin-top:.25rem}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;padding:3rem;color:#6b7280;font-size:.85rem}
.spinner{width:1.5rem;height:1.5rem;border:2px solid #e5e7eb;border-top-color:#1a1a2e;border-radius:50%;animation:spin .6s linear infinite;margin-right:.75rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:2rem;max-width:500px;width:90%;max-height:80vh;overflow-y:auto}
.modal h3{font-size:1rem;font-weight:600;margin-bottom:1rem}
.modal .form-group{margin-bottom:1rem}
</style>
</head>
<body>

<div class="topbar">
  <h1>🎯 AI Authority — Admin</h1>
  <div class="stats">
    <div>Total: <span id="statTotal">0</span></div>
    <div>Active: <span id="statActive">0</span></div>
    <div>Revenue: <span id="statRevenue">€0</span></div>
  </div>
</div>

<div class="container">
  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="orders">Orders</button>
    <button class="tab" data-tab="audit">Run Audit</button>
  </div>

  <!-- Orders Tab -->
  <div id="tab-orders">
    <table class="orders-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Customer</th>
          <th>URL</th>
          <th>Product</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Score</th>
          <th>Shield End</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="ordersBody">
        <tr><td colspan="9" class="loading"><div class="spinner"></div> Loading orders...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Audit Tab -->
  <div id="tab-audit" style="display:none">
    <div class="audit-form">
      <h3>Run GEO Audit</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Website URL</label>
          <input type="url" id="auditUrl" placeholder="https://example.si">
        </div>
        <div class="form-group" style="max-width:150px">
          <label>Order ID (optional)</label>
          <input type="text" id="auditOrderId" placeholder="#123">
        </div>
        <button class="btn" id="runAuditBtn" onclick="runAudit()">Analyze</button>
      </div>
    </div>

    <div id="auditResult"></div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>Edit Order</h3>
    <input type="hidden" id="editId">
    <div class="form-group">
      <label>Customer URL</label>
      <input type="url" id="editUrl">
    </div>
    <div class="form-group">
      <label>Customer Name</label>
      <input type="text" id="editName">
    </div>
    <div class="form-group">
      <label>Notes</label>
      <input type="text" id="editNotes">
    </div>
    <div style="display:flex;gap:.5rem;justify-content:flex-end">
      <button class="btn" style="background:#6b7280" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<script>
let orders = [];

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('[id^="tab-"]').forEach(p => p.style.display = 'none');
    document.getElementById('tab-' + tab.dataset.tab).style.display = 'block';
  });
});

// Load orders
async function loadOrders() {
  try {
    const res = await fetch('/api/ai-authority/orders.php');
    const data = await res.json();
    orders = data.orders || [];
    
    document.getElementById('statTotal').textContent = data.stats?.total || 0;
    document.getElementById('statActive').textContent = data.stats?.active || 0;
    document.getElementById('statRevenue').textContent = '€' + ((data.stats?.total_onetime || 0) / 100).toFixed(0);
    
    renderOrders();
  } catch (e) {
    document.getElementById('ordersBody').innerHTML = '<tr><td colspan="9" style="color:#dc2626">Error loading orders</td></tr>';
  }
}

function renderOrders() {
  const body = document.getElementById('ordersBody');
  if (!orders.length) {
    body.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:2rem;color:#6b7280">No orders yet</td></tr>';
    return;
  }
  
  body.innerHTML = orders.map(o => {
    const badge = o.status === 'active' ? 'badge-active' : 
                  o.status === 'pending' ? 'badge-pending' : 
                  o.status === 'cancelled' ? 'badge-cancelled' : 'badge-expired';
    
    const lastAudit = o.last_score || '—';
    const scoreClass = lastAudit > 80 ? 'score-a' : lastAudit > 60 ? 'score-b' : lastAudit > 40 ? 'score-c' : 'score-d';
    
    return `<tr>
      <td>#${o.id}</td>
      <td><strong>${o.customer_name || '—'}</strong><br><span style="font-size:.7rem;color:#6b7280">${o.stripe_customer_email || ''}</span></td>
      <td>${o.customer_url ? '<a href="' + o.customer_url + '" target="_blank" style="color:#2563eb;font-size:.75rem">' + o.customer_url.substring(0,30) + '...</a>' : '<button class="btn btn-sm" onclick="editOrder(' + o.id + ', \'' + (o.customer_url||'') + '\', \'' + (o.customer_name||'') + '\', \'' + (o.customer_notes||'') + '\')">Set URL</button>'}</td>
      <td>${o.product === 'ai_authority' ? '€699 one-time' : '€49/mo'}</td>
      <td>€${((o.amount||0)/100).toFixed(0)}</td>
      <td><span class="badge ${badge}">${o.status}</span></td>
      <td>${lastAudit !== '—' ? '<span class="score ' + scoreClass + '">' + lastAudit + '</span>' : '—'}</td>
      <td style="font-size:.7rem">${o.shield_end ? new Date(o.shield_end).toLocaleDateString() : '—'}</td>
      <td>
        <button class="btn btn-sm" onclick="viewOrder(${o.id})">View</button>
        <button class="btn btn-sm" style="background:#6b7280" onclick="editOrder(${o.id}, '${(o.customer_url||'').replace(/'/g,"\\'")}', '${(o.customer_name||'').replace(/'/g,"\\'")}', '${(o.customer_notes||'').replace(/'/g,"\\'")}')">Edit</button>
      </td>
    </tr>`;
  }).join('');
}

// Run audit
async function runAudit() {
  const url = document.getElementById('auditUrl').value;
  const orderId = document.getElementById('auditOrderId').value;
  
  if (!url) return alert('Enter a URL');
  
  const btn = document.getElementById('runAuditBtn');
  btn.disabled = true;
  btn.textContent = 'Analyzing...';
  
  document.getElementById('auditResult').innerHTML = '<div class="loading"><div class="spinner"></div> Crawling website and analyzing GEO readiness...</div>';
  
  try {
    const res = await fetch('/api/ai-authority/audit.php', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ url, order_id: orderId || null })
    });
    const data = await res.json();
    
    if (data.success) {
      renderReport(data.report, data.deliverables);
    } else {
      document.getElementById('auditResult').innerHTML = '<div style="color:#dc2626;padding:1rem">Error: ' + (data.error || 'Unknown error') + '</div>';
    }
  } catch (e) {
    document.getElementById('auditResult').innerHTML = '<div style="color:#dc2626;padding:1rem">Connection error</div>';
  }
  
  btn.disabled = false;
  btn.textContent = 'Analyze';
}

function renderReport(report, deliverables) {
  const checks = Object.values(report.checks);
  const scoreClass = report.score >= 80 ? 'score-a' : report.score >= 60 ? 'score-b' : report.score >= 40 ? 'score-c' : 'score-d';
  
  let html = `
    <div class="report-panel show">
      <div class="report-header">
        <div>
          <h3 style="font-size:1rem;font-weight:600">GEO Audit: ${report.url}</h3>
          <p style="font-size:.75rem;color:#6b7280;margin-top:.25rem">Grade: <strong>${report.grade}</strong> · Score: <span class="score ${scoreClass}" style="display:inline-flex">${report.score}</span>/100</p>
        </div>
        <div style="text-align:right">
          <div style="font-size:.7rem;color:#6b7280">Missing: ${report.missing.length} items</div>
          <div style="font-size:.7rem;color:#6b7280">Recommendations: ${report.recommendations.length}</div>
        </div>
      </div>
      
      <h4 style="font-size:.8rem;font-weight:600;margin-bottom:.75rem">Checks</h4>
      <div class="checks-grid">
        ${checks.map(c => `
          <div class="check-card">
            <div class="check-icon ${c.passed ? 'check-pass' : 'check-fail'}">${c.passed ? '✓' : '✗'}</div>
            <div class="check-info">
              <h4>${c.label}</h4>
              <p>${c.detail}</p>
            </div>
          </div>
        `).join('')}
      </div>
      
      ${report.recommendations.length ? `
        <h4 style="font-size:.8rem;font-weight:600;margin-top:1.5rem;margin-bottom:.75rem">Recommendations</h4>
        <div class="rec-list">
          ${report.recommendations.map(r => `
            <div class="rec-item">
              <span class="rec-priority rec-${r.priority}">${r.priority}</span>
              <div class="rec-info">
                <h4>${r.title}</h4>
                <p>${r.description}</p>
                <div class="impact">Impact: ${r.impact}</div>
              </div>
            </div>
          `).join('')}
        </div>
      ` : ''}
      
      ${deliverables ? `
        <div class="deliverables">
          <h4 style="font-size:.8rem;font-weight:600;margin-bottom:.75rem">Generated Deliverables</h4>
          ${deliverables.llms_txt ? `
            <div class="deliverable">
              <h4>llms.txt <button class="copy-btn" onclick="copyText('llmsContent')">Copy</button></h4>
              <pre id="llmsContent">${escapeHtml(deliverables.llms_txt)}</pre>
            </div>
          ` : ''}
          ${deliverables.schema_org ? `
            <div class="deliverable">
              <h4>Schema.org JSON-LD <button class="copy-btn" onclick="copyText('schemaContent')">Copy</button></h4>
              <pre id="schemaContent">${escapeHtml(deliverables.schema_org)}</pre>
            </div>
          ` : ''}
        </div>
      ` : ''}
    </div>
  `;
  
  document.getElementById('auditResult').innerHTML = html;
}

// Edit order
function editOrder(id, url, name, notes) {
  document.getElementById('editId').value = id;
  document.getElementById('editUrl').value = url;
  document.getElementById('editName').value = name;
  document.getElementById('editNotes').value = notes;
  document.getElementById('editModal').classList.add('show');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('show');
}

async function saveEdit() {
  const id = document.getElementById('editId').value;
  const data = {
    id: parseInt(id),
    customer_url: document.getElementById('editUrl').value,
    customer_name: document.getElementById('editName').value,
    customer_notes: document.getElementById('editNotes').value,
  };
  
  await fetch('/api/ai-authority/orders.php', {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data),
  });
  
  closeModal();
  loadOrders();
}

async function viewOrder(id) {
  const res = await fetch('/api/ai-authority/orders.php?id=' + id);
  const data = await res.json();
  
  if (data.audits && data.audits.length) {
    const report = JSON.parse(data.audits[0].raw_report);
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector('[data-tab="audit"]').classList.add('active');
    document.getElementById('tab-orders').style.display = 'none';
    document.getElementById('tab-audit').style.display = 'block';
    renderReport(report, null);
  } else {
    alert('No audits yet for this order. Run one from the Audit tab.');
  }
}

function copyText(id) {
  const text = document.getElementById(id).textContent;
  navigator.clipboard.writeText(text);
  event.target.textContent = 'Copied!';
  setTimeout(() => event.target.textContent = 'Copy', 1500);
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Init
loadOrders();
</script>
</body>
</html>
