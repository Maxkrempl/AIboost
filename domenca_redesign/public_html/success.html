    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome! — HD Web Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 3rem; max-width: 480px; text-align: center; }
        .check { font-size: 64px; margin-bottom: 1rem; }
        h1 { font-size: 28px; font-weight: 700; color: #f8fafc; margin-bottom: 0.75rem; }
        p { font-size: 15px; color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
        .btn { display: inline-block; padding: 12px 28px; background: #6366f1; color: white; text-decoration: none; border-radius: 10px; font-weight: 500; font-size: 14px; transition: background 0.15s; }
        .btn:hover { background: #4f46e5; }
        .btn-secondary { background: transparent; border: 1px solid #475569; color: #94a3b8; margin-left: 10px; }
        .btn-secondary:hover { border-color: #6366f1; color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">🎉</div>
        <h1>Welcome aboard!</h1>
        <p>Your subscription is active. You now have unlimited access to all tools.</p>
        <p style="font-size:13px;color:#64748b">A confirmation email has been sent to your address.</p>
        <div style="margin-top:2rem">
            <a href="/menu-boost/" class="btn">Open MenuBoost</a>
            <a href="/boost-suite/" class="btn btn-secondary">Open BoostSuite</a>
        </div>
    </div>
<script src="/chatbot/widget.js" defer></script>
    </body>
</html>
